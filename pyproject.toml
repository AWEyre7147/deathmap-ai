[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deathmap-ai"
version = "0.1.0"
description = "Evidence-discovery evaluation for CRISPR perturbation resources"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deathmap-resolve-publication = "deathmap_ai.publication_identifiers:main"
deathmap-enrich-geo = "deathmap_ai.geo_enrichment:main"
deathmap-enrich-geo-collection = "deathmap_ai.geo_collection:main"
deathmap-enrich-ena-collection = "deathmap_ai.ena_collection:main"
deathmap-export-ena-workbook = "deathmap_ai.ena_workbook:main"

deathmap-enrichment-stage = "deathmap_ai.enrichment_commands:main"

deathmap-export-enrichment = "deathmap_ai.enrichment_export:main"

deathmap-synthesize-enrichment = "deathmap_ai.enrichment_consolidation:main"

deathmap-enrich-pmc = "deathmap_ai.pmc_supplemental_collection:main"

deathmap-enrich-biostudies = "deathmap_ai.biostudies_collection:main"

deathmap-enrich-mendeley-data = "deathmap_ai.mendeley_title_enrichment:main"

deathmap-enrich-figshare = "deathmap_ai.figshare_enrichment:main"

[tool.setuptools.package-data]
deathmap_ai = ["reference_schema.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
