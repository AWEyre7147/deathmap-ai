[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deathmap-ai"
version = "0.1.0"
description = "Evidence-discovery evaluation for CRISPR perturbation resources"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deathmap-orcs = "deathmap_ai.cli:main"
deathmap-search-orcs = "deathmap_ai.orcs_crispr_pilot:main"
deathmap-export-excel = "deathmap_ai.excel_export:main"
deathmap-resolve-publication = "deathmap_ai.publication_identifiers:main"

[tool.setuptools.package-data]
deathmap_ai = ["reference_schema.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
