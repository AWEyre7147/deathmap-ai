[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deathmap-ai"
version = "0.1.0"
description = "Evidence-discovery evaluation for CRISPR perturbation resources"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]

[project.scripts]
deathmap-orcs = "deathmap_ai.cli:main"
deathmap-omicsdi = "deathmap_ai.omicsdi_cli:main"
deathmap-search = "deathmap_ai.shared_search:main"
deathmap-migrate = "deathmap_ai.resource_migration:main"
deathmap-discover = "deathmap_ai.discovery_v02:main"

[tool.setuptools.package-data]
deathmap_ai = ["reference_schema.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
